name: lesson-gates

# Makes the detection gates self-enforcing: if hooks/evidence-audit stops flagging
# a real violation (or starts flagging a tagged/probed rewrite), or dev-server-guard
# stops blocking a backgrounded watcher, CI goes red. A detection hook with no test
# is the SOFT trap it exists to prevent.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax + shellcheck
        run: |
          bash -n hooks/evidence-audit.sh
          bash -n hooks/dev-server-guard.sh
          python3 -m py_compile hooks/evidence-audit.py
          shellcheck -S error hooks/evidence-audit.sh hooks/dev-server-guard.sh

      - name: evidence-audit -- causal fail fixture MUST flag (Lesson 2)
        run: |
          if bash hooks/evidence-audit.sh hooks/test-fixtures/fail_untagged_diagnosis.jsonl; then
            echo "::error::causal fixture did NOT flag the '242 snapshot' diagnosis"; exit 1
          fi
          echo "causal flagged as expected"

      - name: evidence-audit -- causal pass fixture MUST be clean
        run: bash hooks/evidence-audit.sh hooks/test-fixtures/pass_tagged_diagnosis.jsonl

      - name: evidence-audit -- absence/state fail fixture MUST flag (Lessons 11/12/15)
        run: |
          if bash hooks/evidence-audit.sh hooks/test-fixtures/fail_absence_state.jsonl; then
            echo "::error::absence/state fixture did NOT flag"; exit 1
          fi
          echo "absence/state flagged as expected"

      - name: evidence-audit -- absence/state pass fixture MUST be clean (probe+tag)
        run: bash hooks/evidence-audit.sh hooks/test-fixtures/pass_absence_probed.jsonl

      - name: evidence-audit -- Stop mode blocks on a violation
        run: |
          OUT="$(printf '{"transcript_path":"%s/hooks/test-fixtures/fail_untagged_diagnosis.jsonl","stop_hook_active":false}' "$PWD" \
            | bash hooks/evidence-audit.sh --stop)"
          echo "$OUT" | grep -q '"decision": "block"' || { echo "::error::Stop mode did not block"; exit 1; }
          echo "Stop mode blocked as expected"

      - name: evidence-audit -- Stop loop-guard (stop_hook_active=true is silent)
        run: |
          OUT="$(printf '{"transcript_path":"%s/hooks/test-fixtures/fail_absence_state.jsonl","stop_hook_active":true}' "$PWD" \
            | bash hooks/evidence-audit.sh --stop)"
          [ -z "$OUT" ] || { echo "::error::loop guard failed"; exit 1; }
          echo "loop guard held (silent) as expected"

      - name: dev-server-guard -- backgrounded watcher MUST block (Lesson 14)
        run: |
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"npm run dev","run_in_background":true}}' | bash hooks/dev-server-guard.sh)"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::dev-server-guard did not block"; exit 1; }
          echo "backgrounded watcher blocked as expected"

      - name: dev-server-guard -- foreground start+kill MUST pass
        run: |
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"npm run dev & P=$!; sleep 3; curl -sf localhost:3000; kill $P"}}' | bash hooks/dev-server-guard.sh)"
          [ -z "$OUT" ] || { echo "::error::dev-server-guard blocked an allowed foreground start+kill"; exit 1; }
          echo "foreground start+kill allowed as expected"

      - name: dev-server-guard -- build (not a watcher) MUST pass
        run: |
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"vite build","run_in_background":true}}' | bash hooks/dev-server-guard.sh)"
          [ -z "$OUT" ] || { echo "::error::dev-server-guard blocked a non-watching build"; exit 1; }
          echo "build allowed as expected"

      - name: precompact-archive -- snapshots the transcript before compaction
        run: |
          bash -n hooks/precompact-archive.sh
          shellcheck -S error hooks/precompact-archive.sh
          TMP="$(mktemp "${RUNNER_TEMP:-/tmp}/t.XXXX.jsonl")"; echo '{"type":"user"}' > "$TMP"
          export HOME="${RUNNER_TEMP:-/tmp}/fakehome"; mkdir -p "$HOME"
          printf '{"transcript_path":"%s","trigger":"auto"}' "$TMP" | bash hooks/precompact-archive.sh
          N="$(ls "$HOME"/.claude/precompact-archives/*.jsonl 2>/dev/null | wc -l)"
          [ "$N" -ge 1 ] || { echo "::error::precompact-archive did not snapshot the transcript"; exit 1; }
          echo "precompact-archive snapshotted as expected"

      - name: precompact-archive -- missing transcript_path is a silent no-op
        run: printf '{"trigger":"auto"}' | bash hooks/precompact-archive.sh

      - name: secret-scanner + python-format -- syntax + shellcheck
        run: |
          bash -n hooks/secret-scanner.sh
          bash -n hooks/python-format.sh
          shellcheck -S error hooks/secret-scanner.sh hooks/python-format.sh

      - name: secret-scanner -- staged credential MUST block (Lesson 13)
        run: |
          R="$(mktemp -d)"; git -C "$R" init -q
          # AWS's documented example key -- never a live credential
          printf 'aws_key = "AKIAIOSFODNN7EXAMPLE"\npassword = "hunter2hunter2"\n' > "$R/config.py"
          git -C "$R" add config.py
          OUT="$(cd "$R" && printf '{"tool_name":"Bash","tool_input":{"command":"git commit -m test"}}' | bash "$GITHUB_WORKSPACE/hooks/secret-scanner.sh")"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::secret-scanner did not block a staged credential"; exit 1; }
          echo "$OUT" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "::error::secret-scanner block output is not valid JSON"; exit 1; }
          echo "staged credential blocked as expected"

      - name: secret-scanner -- git -C <repo> commit form MUST also block
        run: |
          R="$(mktemp -d)"; git -C "$R" init -q
          printf 'token = "AKIAIOSFODNN7EXAMPLE"\n' > "$R/config.py"
          git -C "$R" add config.py
          # cwd is the workspace, NOT the repo -- exercises the -C extraction branch
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"git -C %s commit -m test"}}' "$R" | bash hooks/secret-scanner.sh)"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::secret-scanner did not block the git -C form"; exit 1; }
          echo "git -C form blocked as expected"

      - name: secret-scanner -- clean staged diff MUST pass
        run: |
          R="$(mktemp -d)"; git -C "$R" init -q
          printf 'GREETING = "hello"\n' > "$R/config.py"
          git -C "$R" add config.py
          OUT="$(cd "$R" && printf '{"tool_name":"Bash","tool_input":{"command":"git commit -m test"}}' | bash "$GITHUB_WORKSPACE/hooks/secret-scanner.sh")"
          [ -z "$OUT" ] || { echo "::error::secret-scanner blocked a clean diff"; exit 1; }
          echo "clean diff allowed as expected"

      - name: secret-scanner -- non-commit command MUST pass untouched
        run: |
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"git status"}}' | bash hooks/secret-scanner.sh)"
          [ -z "$OUT" ] || { echo "::error::secret-scanner intercepted a non-commit command"; exit 1; }
          echo "non-commit command ignored as expected"

      - name: python-format -- formats a Python file after Write (ruff present)
        run: |
          python3 -m pip install --user --quiet ruff==0.15.9 || pipx install ruff==0.15.9
          F="$(mktemp -d)/sample.py"
          printf 'x=1;y=2\n' > "$F"
          printf '{"tool_name":"Write","tool_input":{"file_path":"%s"}}' "$F" | bash hooks/python-format.sh
          grep -q '^x = 1$' "$F" || { echo "::error::python-format did not format the file"; exit 1; }
          echo "python file formatted as expected"

      - name: python-format -- non-Python file MUST be untouched
        run: |
          F="$(mktemp -d)/notes.md"
          printf '# heading\n' > "$F"
          printf '{"tool_name":"Write","tool_input":{"file_path":"%s"}}' "$F" | bash hooks/python-format.sh
          grep -q '^# heading$' "$F" || { echo "::error::python-format touched a non-Python file"; exit 1; }
          echo "non-Python file untouched as expected"

      - name: loop-cap-guard -- syntax + shellcheck
        run: |
          bash -n hooks/loop-cap-guard.sh
          shellcheck -S error hooks/loop-cap-guard.sh

      - name: loop-cap-guard -- capless loop launch MUST block (Lesson 22)
        run: |
          OUT="$(printf '{"tool_name":"ScheduleWakeup","tool_input":{"delaySeconds":1200,"reason":"keep working","prompt":"continue the sweep"}}' | bash hooks/loop-cap-guard.sh)"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::loop-cap-guard did not block a capless launch"; exit 1; }
          echo "$OUT" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "::error::loop-cap-guard block output is not valid JSON"; exit 1; }
          echo "capless launch blocked as expected"

      - name: loop-cap-guard -- launch declaring stop primitives MUST pass
        run: |
          OUT="$(printf '{"tool_name":"ScheduleWakeup","tool_input":{"delaySeconds":1200,"reason":"iteration 3 of max 5, budget 200k tokens, escalate to operator on stall","prompt":"continue"}}' | bash hooks/loop-cap-guard.sh)"
          [ -z "$OUT" ] || { echo "::error::loop-cap-guard blocked a properly capped launch"; exit 1; }
          echo "capped launch allowed as expected"

      - name: loop-cap-guard -- capless CronCreate MUST block
        run: |
          OUT="$(printf '{"tool_name":"CronCreate","tool_input":{"schedule":"0 9 * * *","prompt":"check the deploys"}}' | bash hooks/loop-cap-guard.sh)"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::loop-cap-guard did not block a capless cron"; exit 1; }
          echo "capless cron blocked as expected"

      - name: loop-cap-guard -- non-scheduling tool MUST pass untouched
        run: |
          OUT="$(printf '{"tool_name":"Bash","tool_input":{"command":"ls"}}' | bash hooks/loop-cap-guard.sh)"
          [ -z "$OUT" ] || { echo "::error::loop-cap-guard intercepted a non-scheduling tool"; exit 1; }
          echo "non-scheduling tool ignored as expected"

      - name: scaffold hooks -- syntax + shellcheck (previously uncovered)
        run: |
          bash -n hooks/prototype-scaffold-guard.sh
          bash -n hooks/lesson-loop-audit.sh
          shellcheck -S error hooks/prototype-scaffold-guard.sh hooks/lesson-loop-audit.sh

      - name: scaffold regex -- plain "to navigate" prose MUST pass (Lesson 3 FP)
        run: |
          OUT="$(printf '{"tool_name":"Write","tool_input":{"file_path":"/x/frontend/src/components/Foo.tsx","content":"/** Internal route path to navigate to on Enter / click. */"}}' | bash hooks/prototype-scaffold-guard.sh)"
          [ -z "$OUT" ] || { echo "::error::guard blocked a legitimate docstring (the CommandPalette/NotificationBell false positive)"; exit 1; }
          echo "legitimate 'to navigate' docstring allowed as expected"

      - name: scaffold regex -- glyph nav-hint + stepper MUST block (Lesson 3)
        run: |
          OUT="$(printf '{"tool_name":"Write","tool_input":{"file_path":"/x/frontend/src/components/Foo.tsx","content":"<span>← → to navigate</span>"}}' | bash hooks/prototype-scaffold-guard.sh)"
          echo "$OUT" | grep -q '"decision":"block"' || { echo "::error::guard did not block the ← → nav-hint copy"; exit 1; }
          echo "$OUT" | grep -q '"permissionDecision":"deny"' || { echo "::error::guard block missing permissionDecision:deny (non-denying contract)"; exit 1; }
          OUT2="$(printf '{"tool_name":"Write","tool_input":{"file_path":"/x/frontend/src/components/Foo.tsx","content":"PAGE 0 OF 3"}}' | bash hooks/prototype-scaffold-guard.sh)"
          echo "$OUT2" | grep -q '"decision":"block"' || { echo "::error::guard did not block the stepper eyebrow"; exit 1; }
          echo "scaffold copy blocked as expected"

      - name: scaffold regex -- write-time guard and detector MUST stay in sync
        run: |
          A="$(grep -m1 '^SCAFFOLD_RE=' hooks/prototype-scaffold-guard.sh)"
          B="$(grep -m1 '^SCAFFOLD_RE=' hooks/lesson-loop-audit.sh)"
          [ "${A#*=}" = "${B#*=}" ] || { echo "::error::SCAFFOLD_RE drifted between prototype-scaffold-guard.sh and lesson-loop-audit.sh"; exit 1; }
          echo "SCAFFOLD_RE in sync across both hooks"

      - name: evidence-audit -- SessionStart digest is scoped to the CURRENT project
        run: |
          FAKE="${RUNNER_TEMP:-/tmp}/scopehome"; rm -rf "$FAKE"
          P="$FAKE/.claude/projects"
          mkdir -p "$P/-tmp-scopetest" "$P/-other-project" /tmp/scopetest
          cp hooks/test-fixtures/fail_untagged_diagnosis.jsonl "$P/-other-project/other.jsonl"
          OUT="$(cd /tmp/scopetest && HOME="$FAKE" bash "$GITHUB_WORKSPACE/hooks/evidence-audit.sh")"
          [ -z "$OUT" ] || { echo "::error::digest surfaced ANOTHER project's claims (cross-project misattribution)"; exit 1; }
          cp hooks/test-fixtures/fail_untagged_diagnosis.jsonl "$P/-tmp-scopetest/own.jsonl"
          OUT2="$(cd /tmp/scopetest && HOME="$FAKE" bash "$GITHUB_WORKSPACE/hooks/evidence-audit.sh")"
          echo "$OUT2" | grep -q 'own.jsonl' || { echo "::error::digest missed the current project's own claims"; exit 1; }
          echo "digest scoped to the current project as expected"

      - name: Ledger invariant -- NO row is SOFT (every lesson is gated)
        run: |
          N="$(grep -cE '\| SOFT \|' LEDGER.md || true)"
          if [ "$N" -ne 0 ]; then
            echo "::error::$N SOFT (ungated) lesson row(s) remain in LEDGER.md"
            grep -nE '\| SOFT \|' LEDGER.md
            exit 1
          fi
          echo "0 SOFT rows -- every lesson is gated"

      - name: Lesson-graph lint -- every lesson has a live ledger gate (L17)
        run: |
          python3 -m py_compile hooks/lesson-ledger-lint.py
          python3 hooks/lesson-ledger-lint.py

      - name: Lesson-graph lint -- self-test MUST fail on a dangling gate
        run: |
          cp LEDGER.md /tmp/LEDGER.bak
          sed -i 's#`hooks/loop-cap-guard.sh`#`hooks/does-not-exist.sh`#' LEDGER.md
          if python3 hooks/lesson-ledger-lint.py; then
            cp /tmp/LEDGER.bak LEDGER.md
            echo "::error::linter did NOT fail on a dangling gate reference"; exit 1
          fi
          cp /tmp/LEDGER.bak LEDGER.md
          echo "dangling-gate correctly flagged"

      - name: confidentiality-scrub -- syntax + shellcheck
        run: |
          bash -n hooks/confidentiality-scrub.sh
          shellcheck -S error hooks/confidentiality-scrub.sh

      - name: confidentiality-scrub -- self-test (poisoned MUST fail, clean MUST pass)
        run: |
          T="$(mktemp -d)"
          printf 'CANARYTERM123\n' > "$T/deny.txt"
          printf 'has CANARYTERM123 inside\n' > "$T/poisoned.txt"
          printf 'entirely clean\n' > "$T/clean.txt"
          if CONFIDENTIALITY_DENYLIST="$T/deny.txt" bash hooks/confidentiality-scrub.sh --text "$T/poisoned.txt"; then
            echo "::error::scrub did NOT fail on a poisoned file"; exit 1
          fi
          CONFIDENTIALITY_DENYLIST="$T/deny.txt" bash hooks/confidentiality-scrub.sh --text "$T/clean.txt"
          if CONFIDENTIALITY_DENYLIST="$T/absent.txt" CONFIDENTIALITY_SCRUB_REQUIRE=1 bash hooks/confidentiality-scrub.sh --text "$T/clean.txt"; then
            echo "::error::scrub did NOT fail-closed on a required-but-missing denylist"; exit 1
          fi
          echo "scrub self-test passed"

      - name: confidentiality-scrub -- enforce on this repository (denylist from secret)
        # Same-repo refs only: fork PRs receive no secrets, so REQUIRE=1 would
        # false-fail every external contribution. Fork-sourced code is still
        # scanned by the post-merge push run (secrets present) + maintainer review.
        if: >-
          github.repository_owner == 'epicurean-Paradox' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Fail-closed on the owner's repo: the secret must exist and be non-empty.
          DL="$(mktemp)"; printf '%s\n' "$SCRUB_TERMS" > "$DL"
          export CONFIDENTIALITY_DENYLIST="$DL" CONFIDENTIALITY_SCRUB_REQUIRE=1
          # Full tracked worktree (stronger than a diff scan; catches regressions anywhere)
          git ls-files -z | xargs -0 bash hooks/confidentiality-scrub.sh --text
          # Recent commit messages + branch name
          M="$(mktemp)"; git log --format='%s%n%b' -50 > "$M"
          B="$(mktemp)"; printf '%s\n' "$GITHUB_HEAD_REF" "$GITHUB_REF_NAME" > "$B"
          bash hooks/confidentiality-scrub.sh --text "$M" "$B"
          # PR title/body (via env, never shell-interpolated -- script-injection safe)
          P="$(mktemp)"; printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$P"
          bash hooks/confidentiality-scrub.sh --text "$P"

      - name: vertical-knowledge-graph -- validator tests + example validates
        run: |
          python3 -m pip install --user --quiet pyyaml
          python3 -m py_compile patterns/vertical-knowledge-graph/validate_regions.py
          python3 -m unittest discover -s patterns/vertical-knowledge-graph -p 'test_*.py' -v
          python3 patterns/vertical-knowledge-graph/validate_regions.py patterns/vertical-knowledge-graph/examples/acme.regions.yaml
